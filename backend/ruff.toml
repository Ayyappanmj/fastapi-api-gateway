line-length = 110
target-version = "py311"
exclude = ["alembic/versions"]

[lint]
# E/F: pyflakes + pycodestyle errors (real bugs: unused imports, undefined
#      names, etc). I: import sorting. B: flake8-bugbear (common footguns).
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line length is handled by the formatter/line-length setting above
    "B008",  # FastAPI uses Depends(...) and Query(...) in function defaults
]

[lint.isort]
known-first-party = ["app"]
