    <line x1="930" y1="60" x2="1040" y2="90"/>
    <line x1="930" y1="140" x2="1040" y2="90"/>
    <line x1="1040" y1="90" x2="1150" y2="60"/>
    <line x1="1040" y1="90" x2="1150" y2="150"/>
    <line x1="930" y1="140" x2="1020" y2="220"/>
    <line x1="820" y1="90" x2="760" y2="180"/>
    <line x1="760" y1="180" x2="880" y2="250"/>
    <line x1="1020" y1="220" x2="880" y2="250"/>
  </g>
  <g fill="#3dd6c8">
