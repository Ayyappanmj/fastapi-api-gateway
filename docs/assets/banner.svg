    <rect x="178" y="210" width="106" height="28" rx="4" fill="none" stroke="#1f2a44"/>
    <text x="194" y="228">PostgreSQL</text>

    <rect x="294" y="210" width="76" height="28" rx="4" fill="none" stroke="#1f2a44"/>
