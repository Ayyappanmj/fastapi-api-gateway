    <circle cx="97" cy="125" r="4" fill="#3dd6c8"/>
    <line x1="90" y1="118" x2="104" y2="132" stroke="#3dd6c8" stroke-width="2"/>
    <line x1="104" y1="118" x2="90" y2="132" stroke="#3dd6c8" stroke-width="2"/>
  </g>

  <text x="130" y="135" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#e6eaf2">
