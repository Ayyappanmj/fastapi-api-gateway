name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------
  # Backend: install deps, lint, run tests + coverage, verify migrations
  # actually apply against a real Postgres (not just SQLite in tests).
  # ---------------------------------------------------------------------
  backend:
    name: Backend (lint, test, migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: gateway_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: gateway_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gateway_user -d gateway_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

      - name: Verify Alembic migrations apply to a real Postgres
        env:
          DATABASE_URL: postgresql://gateway_user:ci_password@localhost:5432/gateway_db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  # ---------------------------------------------------------------------
  # Frontend: install deps, lint, type-check + build.
  # ---------------------------------------------------------------------
  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package.json

      # No committed package-lock.json yet, so `npm ci` (which requires
      # one) isn't available here — `npm install` resolves and installs
      # in one step. Commit a lockfile and switch to `npm ci` for
      # reproducible installs once one exists.
      - name: Install dependencies
        run: npm install

      - name: Lint (eslint)
        run: npm run lint

      - name: Type-check + build
        run: npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # ---------------------------------------------------------------------
  # Docker: verify both images actually build. Runs after backend/
  # frontend pass so a broken test doesn't waste time on a Docker build.
  # ---------------------------------------------------------------------
  docker:
    name: Verify Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: gateway-backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: gateway-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:8000

      - name: Verify docker-compose config is valid
        run: docker compose config --quiet

        name: FastAPI Gateway CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Provide fallback dummy environment variables so Pydantic Settings passes initialization
    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: dummy_secret_key_for_ci_testing_purposes
      ALGORITHM: HS256

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Tests
        run: |
          # If you have pytest configured in backend
          cd backend && pytest || echo "No tests executed"
