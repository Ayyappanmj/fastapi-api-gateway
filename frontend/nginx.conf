server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router handles routing client-side, so any path that isn't a
    # real file (e.g. /analytics on a hard refresh) must still serve
    # index.html rather than 404 — the app then renders the right route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints built assets (e.g. index-a1b2c3.js), so they're
    # safe to cache aggressively — a new build gets a new filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
